name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.27'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync echo-kit --version

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.27'
          python-version: '3.12'
      - name: Check release version
        run: |
          uv run --no-project python - <<'PY'
          import os, tomllib, runpy
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag/package version mismatch'
          assert runpy.run_path('src/echo_kit/__init__.py')['__version__'] == version
          PY
      - run: uv build --no-sources
      - name: Check package metadata
        run: uvx --from twine twine check dist/*
      - run: uv publish --trusted-publishing always
